services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${MINIO_DATA_DIR:-./.local/minio}:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5

  setup-minio:
    image: minio/minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/camu-data &&
             echo 'Bucket ready'"
    restart: "no"

  camu:
    build: .
    depends_on:
      setup-minio:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "9092:9092"
    volumes:
      - camu-cache:/var/lib/camu/cache
      - ./camu.docker.yaml:/etc/camu/camu.yaml:ro
    command: ["serve", "--config", "/etc/camu/camu.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  camu-cache:
